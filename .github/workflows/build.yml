name: Build & Release

# - push / pull request to main: build the app (sanity check)
# - tag vX.Y.Z:                 build Setup.exe + MSIX and publish a GitHub Release
# - manual run:                 build Setup.exe + MSIX as workflow artifacts (no release)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src\WMover.csproj -c Release -warnaserror

  package:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: write   # gh release create
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        run: |
          $v = ([xml](Get-Content src\WMover.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tag -ne $v) { throw "Tag v$tag does not match <Version>$v</Version> in src\WMover.csproj." }
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer (Inno Setup)
        run: .\Publish-Setup.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Build MSIX
        run: .\Publish-Store.ps1 -Version '${{ steps.version.outputs.version }}.0'

      - uses: actions/upload-artifact@v4
        with:
          name: WMover-${{ steps.version.outputs.version }}
          path: |
            bin/WMover_Setup_*.exe
            bin/WMover_*.msix
          if-no-files-found: error

      - name: Publish GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            (Get-ChildItem bin\WMover_Setup_*.exe).FullName `
            (Get-ChildItem bin\WMover_*.msix).FullName `
            --title "WMover ${{ steps.version.outputs.version }}" `
            --generate-notes
